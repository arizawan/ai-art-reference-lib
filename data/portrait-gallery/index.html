<style>
:root{--bg:#0d0f12;--bg2:#14171c;--panel:#1a1e24;--line:#272c34;--line2:#343a44;--tx:#e9ecf1;--tx2:#a3abb8;--tx3:#6c7482;--ac:#8fb4ff;--ac2:#c3d5ff;--r:14px;--sh:0 10px 30px rgba(0,0,0,.45);--f:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f)}
body{min-height:100vh;background:radial-gradient(1200px 500px at 15% -10%,#1b2433 0,transparent 60%),var(--bg)}
button,select,input{font:inherit;color:inherit}
.hero{padding:34px clamp(16px,4vw,48px) 18px;max-width:1600px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--tx3);text-transform:uppercase}
.hero h1{margin:6px 0 4px;font-size:clamp(24px,3.4vw,38px);font-weight:700}
.hero h1 span{background:linear-gradient(90deg,var(--ac2),#e3c8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--tx2);font-size:14px;margin:0}
.tools{position:sticky;top:0;z-index:20;background:rgba(13,15,18,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tools-in{max-width:1600px;margin:0 auto;padding:10px clamp(16px,4vw,48px)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;min-height:48px;border:1px solid #4a525f;background:var(--panel);padding:0 18px;border-radius:99px;cursor:pointer;font-size:15px;font-weight:700;color:#dfe3ea}
.tab em{font-style:normal;font-size:13px;font-weight:600;color:#aab2bf;margin-left:8px}
.tab[aria-selected=true]{background:var(--tx);color:#111;border-color:var(--tx)}
.tab[aria-selected=true] em{color:#3a3f47}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.search{flex:1 1 240px;position:relative}
.search input{width:100%;min-height:48px;font-size:15px;background:var(--panel);border:1px solid #4a525f;border-radius:12px;padding:0 14px 0 40px;outline:none}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid #4a525f;background:var(--panel);cursor:pointer;font-size:13px;font-weight:600;color:#dfe3ea}
.seg button[aria-pressed=true]{background:var(--tx);color:#111;border-color:var(--tx)}
.count{color:var(--tx2);font-size:13px;margin-left:auto}
main{max-width:1600px;margin:0 auto;padding:18px clamp(16px,4vw,48px) 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:var(--sh)}
.card:focus{outline:2px solid var(--ac);outline-offset:2px}
.ph{aspect-ratio:4/5;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.meta{padding:10px 12px 12px}
.meta .id{font-size:11px;color:var(--tx3);letter-spacing:.04em}
.meta h3{margin:4px 0 0;font-size:13px;font-weight:600;line-height:1.35;color:var(--tx)}
.meta .cat{margin-top:4px;font-size:12px;color:var(--tx2)}
.morebtn{display:block;margin:18px auto 0;min-height:48px;padding:0 22px;border-radius:12px;border:1px solid #4a525f;background:var(--panel);cursor:pointer;font-weight:700}
.empty{padding:40px;text-align:center;color:var(--tx2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.open{display:flex}
.mbox{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;max-width:1100px;width:100%;max-height:90vh}
.mimg{position:relative;background:#111;border-radius:var(--r);overflow:auto;display:flex;align-items:center;justify-content:center}
.mimg img{max-width:100%;max-height:85vh;object-fit:contain}
.mside{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:16px;overflow:auto}
.mside h2{margin:0 0 8px;font-size:18px}
.mside .id{color:var(--tx2);font-size:13px;margin-bottom:12px}
.dl{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:10px;background:var(--tx);color:#111;text-decoration:none;font-weight:700;font-size:14px}
.keys{margin-top:14px;color:var(--tx3);font-size:12px}
.close{position:fixed;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--bg2);cursor:pointer;font-size:20px;z-index:60}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:rgba(20,23,28,.85);cursor:pointer;font-size:22px}
.nav.l{left:10px}.nav.r{right:10px}
@media(max-width:800px){.mbox{grid-template-columns:1fr}}
</style>
</head>

const PAGE=120;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US');
const S={section:'', hair:'', style:'', q:'', n:PAGE};
function drawTabs(){
  const t=[['','All',D.length],['face','Face',META.sections.face],['styling','Styling',META.sections.styling]];
  $('#tabs').innerHTML=t.map(([v,l,n])=>`<button class="tab" role="tab" data-v="${esc(v)}" aria-selected="${S.section===v}">${esc(l)}<em>${fmt(n)}</em></button>`).join('');
}
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;S.section=b.dataset.v;S.n=PAGE;drawTabs();draw()};
$('#hair').innerHTML=[['','All hair'],...META.hairs.map(h=>[h,META.hairLabels[h]])].map(([v,l])=>`<button data-v="${esc(v)}" aria-pressed="${v===''}">${esc(l)}</button>`).join('');
$('#hair').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.hair=b.dataset.v;[...$('#hair').children].forEach(x=>x.setAttribute('aria-pressed',x===b));S.n=PAGE;draw()};
$('#style').innerHTML='<option value="">Style: all ('+META.styles.length+')</option>'+META.styles.map(s=>`<option value="${esc(s.label)}">${esc(s.label)} (${s.n})</option>`).join('');
$('#style').onchange=e=>{S.style=e.target.value;S.n=PAGE;draw()};
let qt;$('#q').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value.trim().toLowerCase();S.n=PAGE;draw()},120)};
function hit(d){
  if(S.section&&d.section!==S.section)return false;
  if(S.hair&&d.hair!==S.hair)return false;
  if(S.style&&d.style!==S.style)return false;
  if(!S.q)return true;
  const blob=(d.id+' '+d.label+' '+(d.style||'')+' '+d.hairLabel+' '+d.tags.join(' ')).toLowerCase();
  return S.q.split(/\s+/).every(w=>blob.includes(w));
}
let VIEW=[];
function card(d,i){return `<article class="card" tabindex="0" data-i="${i}"><div class="ph"><img loading="lazy" decoding="async" src="${esc(d.thumb)}" alt="${esc(d.label)}"></div><div class="meta"><div class="id">${esc(d.id)}</div><h3>${esc(d.label)}</h3><div class="cat">${esc(d.section)} · ${esc(d.hairLabel)}</div></div></article>`}
function draw(){
  VIEW=D.filter(hit);const g=$('#grid');
  $('#count').textContent=`${fmt(VIEW.length)} shown`;
  g.innerHTML=VIEW.slice(0,S.n).map(card).join('');
  if(!VIEW.length)g.innerHTML=`<div class="empty" style="grid-column:1/-1"><b>No matching images</b><div>Try another section, hair, or style.</div></div>`;
  const m=$('#more');m.hidden=VIEW.length<=S.n;m.textContent=`Show more (${fmt(Math.max(0,VIEW.length-S.n))} left)`;
}
function addMore(){if(S.n>=VIEW.length)return;const from=S.n;S.n+=PAGE;$('#grid').insertAdjacentHTML('beforeend',VIEW.slice(from,S.n).map((d,k)=>card(d,from+k)).join(''));const m=$('#more');m.hidden=VIEW.length<=S.n;m.textContent=`Show more (${fmt(Math.max(0,VIEW.length-S.n))} left)`}
$('#more').onclick=addMore;
if('IntersectionObserver' in window){new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))addMore()},{rootMargin:'800px'}).observe($('#more'))}
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openM(+c.dataset.i)});
$('#grid').addEventListener('keydown',e=>{if(e.key==='Enter'){const c=e.target.closest('.card');if(c)openM(+c.dataset.i)}});
let MI=0;
function openM(i){MI=i;$('#modal').classList.add('open');document.body.style.overflow='hidden';showM()}
function closeM(){$('#modal').classList.remove('open');document.body.style.overflow='';const c=document.querySelector(`.card[data-i="${MI}"]`);c&&c.focus()}
function showM(){const d=VIEW[MI],img=$('#mimg');img.src=d.thumb;const full=new Image();full.onload=()=>{if(VIEW[MI]===d)img.src=d.full};full.src=d.full;img.alt=d.label;
  $('#mtitle').textContent=d.label;$('#msub').textContent=d.id+' · '+d.section+' · '+d.hairLabel+(d.style?' · '+d.style:'');
  const dl=$('#mdl');dl.href=d.full;dl.setAttribute('download',d.id+'.png')}
function step(n){const j=MI+n;if(j<0||j>=VIEW.length)return;MI=j;if(j>=S.n)addMore();showM()}
$('#mprev').onclick=()=>step(-1);$('#mnext').onclick=()=>step(1);$('#mclose').onclick=closeM;
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
document.addEventListener('keydown',e=>{if(!$('#modal').classList.contains('open'))return;if(e.key==='Escape')closeM();else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
drawTabs();draw();
</script>
